<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Supabase Auth Example</title>
  </head>
  <body>
    <!-- =================================================== -->
    <!-- NEW: Sign Up Container placed above the Login Form  -->
    <!-- =================================================== -->
    <div id="signup-container">
      <h2>Sign Up</h2>
      <form id="signup-form">
        <input type="email" id="signup-email" placeholder="Email" required />
        <input
          type="password"
          id="signup-password"
          placeholder="Password"
          required
        />
        <button type="submit">Sign Up</button>
      </form>
    </div>

    <hr />

    <!-- Login Form -->
    <div id="login-container">
      <h2>Login</h2>
      <form id="login-form">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Log In</button>
      </form>
    </div>

    <!-- Logged-in View -->
    <div id="user-container" style="display: none">
      <p>Welcome, <span id="user-email"></span>!</p>
      <button id="logout-btn">Log Out</button>
    </div>

    <script type="module">
      // NEW: Added signUpUser to imports
      import {
        signUpUser,
        loginUser,
        logoutUser,
        getUserSession,
      } from "./supabaseClient.js";

      // NEW: Grab Sign Up elements
      const signupForm = document.getElementById("signup-form");
      const signupContainer = document.getElementById("signup-container");

      const loginForm = document.getElementById("login-form");
      const logoutBtn = document.getElementById("logout-btn");
      const loginContainer = document.getElementById("login-container");
      const userContainer = document.getElementById("user-container");
      const userEmailSpan = document.getElementById("user-email");

      // ===================================================
      // NEW: Handle Sign Up Form submit
      // ===================================================
      signupForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("signup-email").value;
        const password = document.getElementById("signup-password").value;

        const user = await signUpUser(email, password);
        if (user) {
          updateUI(user);
        }
      });

      // Handle Login submission
      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const user = await loginUser(email, password);
        if (user) {
          updateUI(user);
        }
      });

      // Handle Logout click
      logoutBtn.addEventListener("click", async () => {
        await logoutUser();
        updateUI(null);
      });

      // Check active session on page load
      document.addEventListener("DOMContentLoaded", async () => {
        const user = await getUserSession();
        updateUI(user);
      });

      // Toggle UI elements based on authentication status
      function updateUI(user) {
        if (user) {
          // NEW: Hide signup form when user is logged in
          signupContainer.style.display = "none";
          loginContainer.style.display = "none";
          userContainer.style.display = "block";
          userEmailSpan.textContent = user.email;
        } else {
          // NEW: Show signup form when user is logged out
          signupContainer.style.display = "block";
          loginContainer.style.display = "block";
          userContainer.style.display = "none";
        }
      }
    </script>
  </body>
</html>
